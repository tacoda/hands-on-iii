startup_timeout: 90s
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:49134
  observers:
    # How long a queue::on-message target has per message: 30 s by default.
    # A stage can wait on git or a model call for longer, so give it 30 minutes.
    activation_timeout_ms: 1800000
  workers:
    configuration: {}
    iii-worker-manager:
      host: 127.0.0.1
      port: 49134
    iii-stream:
      host: 127.0.0.1
      port: 3112

containers:
  harness:
    worker: package://harness
    version: "1.9.7"
    config_name: harness  # 0.25 renames an unnamed entry to default-harness
    working_dir: .
    environment:
      SETTINGS_DIR: ${SETTINGS_DIR:-./settings}
    scripts:
      pre_run: python3 scripts/config.py --check
      pre_run_timeout: 10s
  session-manager:
    worker: package://session-manager
    version: "1.1.1"
  context-manager:
    worker: package://context-manager
    version: "1.2.3"
  llm-router:
    worker: package://llm-router
    version: "1.5.3"
    env_file: [./.env.models]
  provider-anthropic:
    worker: package://provider-anthropic
    version: "1.3.2"
  provider-deepseek:
    worker: package://provider-deepseek
    version: "0.2.0"
  provider-openai:
    worker: package://provider-openai
    version: "1.3.1"
  console:
    worker: package://console
    version: "1.10.5"
  state:
    worker: package://state
    version: "0.23.1"
    config_name: state  # 0.25 renames an unnamed entry to default-state
  queue:
    worker: package://queue
    version: "0.22.2"
    config_name: queue  # 0.25 renames an unnamed entry to default-queue
  cron:
    worker: package://cron
    version: "0.22.1"
  shell:
    worker: package://shell
    version: "0.13.5"
  approval-gate:
    worker: package://approval-gate
    version: "1.1.3"
    config_name: approval-gate  # 0.25 renames an unnamed entry to default-approval-gate
  worktree:
    worker: package://worktree
    version: "0.4.3"
    config_name: worktree  # 0.25 renames an unnamed entry to default-worktree
  github:
    worker: package://github
    version: "0.5.2"
    config_name: github  # 0.25 renames an unnamed entry to default-github
    env_file: [./.env.forge]
  audit:
    worker: path://./workers/audit
    # harness and approval-gate own the functions it observes.
    start_after: [harness, approval-gate]
    environment:
      AUDIT_DIR: ${PWD}/state/audit
    scripts:
      # From the worker's own directory, where npm ci put tsx.
      run: npx tsx src/index.ts
  # A path:// worker runs from its own directory unless told otherwise, and
  # the ladder's run line names paths from the project root.
  ladder:
    worker: path://./workers/ladder
    start_after: [harness, audit]
    environment:
      PYTHONUNBUFFERED: "1"
    scripts:
      run: .venv/bin/python workers/ladder/src/main.py
    working_dir: .
  ladder-explain-ts:
    worker: path://./workers/ladder-explain-ts
    start_after: [harness]
    scripts:
      # From the worker's own directory, where npm ci put tsx.
      run: npx tsx src/index.ts
  factory:
    worker: path://./workers/factory
    start_after: [harness, queue, state, audit, planner, http, ladder, approval-gate]
    env_file: [./.env.web]                          # WEB_PASSWORD_HASH
    environment:
      PYTHONUNBUFFERED: "1"
      FACTORY_REPOS: tests/fixtures/sample-repo     # comma-separated; the server lists its own
    scripts:
      run: .venv/bin/python workers/factory/src/main.py
    working_dir: .
  planner:
    worker: path://./workers/planner
    start_after: [queue, state, ladder, approval-gate]
    env_file: [./.env.planner]
    environment:
      PYTHONUNBUFFERED: "1"
    scripts:
      run: .venv/bin/python workers/planner/src/main.py
    working_dir: .
  http:
    worker: package://http
    version: "0.23.2"
    config_override:         # startup values, like the console's port (chapter 3)
      host: 127.0.0.1
      port: 3111
      cors:
        allowed_origins: ["https://factory.example.com"]
