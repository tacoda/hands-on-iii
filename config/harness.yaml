id: harness
name: Harness
description: 'Durable turn-loop settings: default turn cap and pending-call timeout, sub-agent depth/fan-out budgets, output-contract validation retries, the webhook-dedupe TTL, per-dependency RPC timeouts, stream coalescing, and the pending-sweep cron schedule.'
metadata:
  ui_form: harness
value:
  context_timeout_ms: 320000
  default_filesystem_root: null
  default_functions:
    allow:
    - '*'
    deny: []
    expose: agent_trigger
  default_max_turns: 500
  default_pending_timeout_ms: 1800000
  dispatch_timeout_ms: 300000
  idem_ttl_secs: 86400
  max_children: 8
  max_depth: 3
  max_transient_resumes: 3
  max_validation_retries: 2
  router_timeout_ms: 320000
  session_timeout_ms: 10000
  stream_coalesce_ms: 150
  sweep_expression: 0 * * * * *
