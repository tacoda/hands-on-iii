# The job budget and the table price. Read before every stage, so an edit
# applies to the next stage without a restart.
#
# job_max_usd caps one job across every revision and rework. At or over it,
# the factory moves the job to blocked with the reason. A turn with no price
# counts as over, so price every model the phases use.
job_max_usd: 5.00

# Per million tokens, used when the router reports no figure for a turn.
# The providers' list prices on 2026-10-12, the same rates their catalogs carry.
models:
  claude-opus-5:   {input_per_million: 5.00, output_per_million: 25.00}
  claude-sonnet-5: {input_per_million: 2.00, output_per_million: 10.00}
  deepseek-flash:  {input_per_million: 0.30, output_per_million: 1.20}
  gpt-5.2:         {input_per_million: 1.75, output_per_million: 14.00}
